model_name: g09_visual_changenet_classify
encryption_key: ""
results_dir: /workspace/results/inference

model:
  backbone:
    type: c_radio_v2_vit_base_patch16_224
    pretrained_backbone_path: ""
    freeze_backbone: false
  classify:
    train_margin_euclid: 2.0
    eval_margin: 0.3
    embedding_vectors: 5
    embed_dec: 30
    learnable_difference_modules: 4
    difference_module: learnable

dataset:
  classify:
    infer_dataset:
      csv_path: /workspace/datasets/inference.csv
      images_dir: /workspace/images
    image_ext: .jpg
    batch_size: 1
    workers: 1
    num_input: 1
    input_map:
      SolderLight: 0
    grid_map:
      x: 1
      y: 1
    concat_type: linear
    image_width: 224
    image_height: 224
    num_classes: 2
    num_golden: 1

inference:
  num_gpus: 1
  gpu_ids:
    - 0
  num_nodes: 1
  checkpoint: /workspace/models/changenet_model_classify_latest.pth
  trt_engine: ""
  results_dir: /workspace/results/inference
  batch_size: 1
  vis_after_n_batches: 1

task: classify
